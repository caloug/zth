name = "zth-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Auto-update the stats every 5 minutes (replaces GitHub's own scheduler).
[triggers]
crons = ["*/5 * * * *"]

# Public key of the Discord app (not secret) — verifies Discord's signatures.
[vars]
DISCORD_PUBLIC_KEY = "cf2ca5738055897a5d80424a2c114cebed7a8cde690b643b449701f61a4aed51"

# Stores the bot config (notifications on/off). Create it with:
#   npx wrangler kv namespace create CONFIG
# then paste the printed id below.
[[kv_namespaces]]
binding = "CONFIG"
id = "PASTE_KV_ID_HERE"

# GH_TOKEN is set as an encrypted secret (npx wrangler secret put GH_TOKEN).
