name = "zth-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Auto-update the stats every 5 minutes (replaces GitHub's own scheduler).
[triggers]
crons = ["*/5 * * * *"]

# Stores the bot config (notifications on/off). Create it with:
#   npx wrangler kv namespace create CONFIG
# then paste the printed id below.
[[kv_namespaces]]
binding = "CONFIG"
id = "PASTE_KV_ID_HERE"

# DISCORD_PUBLIC_KEY is set as a plain variable (dashboard → Settings → Variables),
# GH_TOKEN as an encrypted secret (npx wrangler secret put GH_TOKEN).
