name: Update stats

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats from the Brawl Stars API
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/update.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes can't see the artifact right after upload: wait, deploy, and retry once.
      - run: sleep 8

      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
